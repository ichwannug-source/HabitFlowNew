<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitFlow AI - Grow Your Habits</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Konfigurasi Tema
        const THEMES = {
            modern: 'from-indigo-600 to-purple-600',
            emerald: 'from-emerald-500 to-teal-600',
            sunset: 'from-orange-500 to-rose-500',
            midnight: 'from-slate-800 to-slate-900'
        };

        // Ikon Lucide Wrapper
        const Icon = ({ name, className }) => {
            const [iconHtml, setIconHtml] = useState('');
            useEffect(() => {
                if (window.lucide) {
                    const icon = window.lucide.icons[name];
                    if (icon) setIconHtml(icon.toSvg({ class: className }));
                }
            }, [name, className]);
            return <span dangerouslySetInnerHTML={{ __html: iconHtml }} />;
        };

        // Komponen Pohon Pertumbuhan
        const GrowthTree = ({ percentage, darkMode }) => (
            <div className="flex flex-col items-center justify-center p-4">
                <svg width="100" height="100" viewBox="0 0 100 100" className="drop-shadow-md transition-all duration-1000">
                    <ellipse cx="50" cy="90" rx="40" ry="8" fill={darkMode ? "#1e293b" : "#e2e8f0"} />
                    {percentage >= 15 && (
                        <g>
                            <path d="M50 90 L50 60" stroke="#78350f" strokeWidth="4" />
                            <path d="M50 75 L40 65" stroke="#78350f" strokeWidth="2" />
                            <path d="M50 70 L60 62" stroke="#78350f" strokeWidth="2" />
                        </g>
                    )}
                    {percentage >= 50 && (
                        <g>
                            <circle cx="50" cy="50" r="18" fill="#22c55e" opacity="0.9" />
                            <circle cx="40" cy="60" r="12" fill="#16a34a" opacity="0.9" />
                            <circle cx="60" cy="60" r="12" fill="#16a34a" opacity="0.9" />
                            <circle cx="50" cy="40" r="12" fill="#4ade80" opacity="0.9" />
                        </g>
                    )}
                    {percentage >= 85 && (
                        <g>
                            <circle cx="42" cy="48" r="3" fill="#ef4444" />
                            <circle cx="58" cy="45" r="3" fill="#ef4444" />
                            <circle cx="50" cy="60" r="3" fill="#ef4444" />
                        </g>
                    )}
                    {percentage < 15 && (
                        <g>
                            <path d="M50 90 Q50 80 55 75" stroke="#4ade80" strokeWidth="3" fill="none" />
                            <path d="M55 75 Q60 70 58 65 Q53 68 55 75" fill="#4ade80" />
                        </g>
                    )}
                </svg>
                <p className={`text-[9px] font-bold mt-2 uppercase tracking-widest ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>
                    {percentage < 25 ? "Fase Bibit" : percentage < 50 ? "Tumbuh" : percentage < 85 ? "Rindang" : "Panen Makna"}
                </p>
            </div>
        );

        function App() {
            const [activeTab, setActiveTab] = useState('tracker');
            const [user, setUser] = useState(() => {
                const saved = localStorage.getItem('habit_user');
                return saved ? JSON.parse(saved) : {
                    name: 'Sobat Habit', bio: 'Berusaha menjadi 1% lebih baik setiap hari.',
                    avatar: '✨', theme: 'modern', points: 0, level: 1, darkMode: false, aiTitle: 'Pemula',
                    lastLoginDate: new Date().toISOString().split('T')[0], apiKey: ""
                };
            });

            const [habits, setHabits] = useState(() => {
                const saved = localStorage.getItem('habit_list');
                return saved ? JSON.parse(saved) : [{ id: 1, name: 'Meditasi 2 Menit', streak: 0, completed: false, note: '' }];
            });

            const [newHabitName, setNewHabitName] = useState('');
            const [aiLoading, setAiLoading] = useState(false);
            const [aiSuggestion, setAiSuggestion] = useState(null);
            const [aiLabContent, setAiLabContent] = useState(null);
            const [showNotification, setShowNotification] = useState(null);

            useEffect(() => { localStorage.setItem('habit_user', JSON.stringify(user)); }, [user]);
            useEffect(() => { localStorage.setItem('habit_list', JSON.stringify(habits)); }, [habits]);

            const dailyProgress = useMemo(() => {
                if (habits.length === 0) return 0;
                return (habits.filter(h => h.completed).length / habits.length) * 100;
            }, [habits]);

            const notify = (msg) => { setShowNotification(msg); setTimeout(() => setShowNotification(null), 3000); };

            const askGemini = async (prompt, systemInstruction) => {
                if (!user.apiKey) { notify("Silakan atur API Key di Profil."); return null; }
                setAiLoading(true);
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${user.apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: systemInstruction }] } })
                    });
                    const data = await res.json();
                    setAiLoading(false);
                    return data.candidates?.[0]?.content?.parts?.[0]?.text;
                } catch (err) { setAiLoading(false); notify("AI Error."); return null; }
            };

            const toggleHabit = (id) => {
                setHabits(prev => prev.map(h => {
                    if (h.id === id) {
                        const isDone = !h.completed;
                        const newPts = Math.max(0, user.points + (isDone ? 15 : -15));
                        setUser(u => ({ ...u, points: newPts, level: Math.floor(newPts / 100) + 1 }));
                        return { ...h, completed: isDone, streak: isDone ? h.streak + 1 : Math.max(0, h.streak - 1) };
                    }
                    return h;
                }));
            };

            return (
                <div className={`min-h-screen pb-28 transition-colors ${user.darkMode ? 'bg-slate-950 text-slate-100' : 'bg-slate-50 text-slate-900'}`}>
                    <div className="h-1.5 w-full fixed top-0 z-50 bg-slate-200 dark:bg-slate-800">
                        <div className={`h-full bg-gradient-to-r ${THEMES[user.theme]} transition-all`} style={{ width: `${user.points % 100}%` }}></div>
                    </div>

                    {showNotification && (
                        <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 bg-slate-900 text-white text-xs rounded-full shadow-2xl flex items-center gap-2">
                            <Icon name="AlertCircle" className="w-3 h-3 text-amber-400" /> {showNotification}
                        </div>
                    )}

                    <div className="max-w-xl mx-auto px-6 pt-10">
                        <header className="flex justify-between items-center mb-10">
                            <div className="flex items-center gap-4">
                                <div className={`w-12 h-12 rounded-2xl bg-gradient-to-br ${THEMES[user.theme]} flex items-center justify-center text-2xl shadow-lg ring-4 ring-white dark:ring-slate-800`}>{user.avatar}</div>
                                <div><h2 className="text-base font-bold">{user.name}</h2><p className="text-[10px] text-slate-400 font-bold">LVL {user.level} • {user.aiTitle}</p></div>
                            </div>
                            <button onClick={() => setActiveTab('profile')} className="p-3 rounded-2xl border bg-white dark:bg-slate-900"><Icon name="Settings" className="w-5 h-5 text-slate-400" /></button>
                        </header>

                        {activeTab === 'tracker' && (
                            <div className="space-y-6 animate-in">
                                <div className={`p-6 rounded-[2.5rem] border flex items-center justify-between ${user.darkMode ? 'bg-slate-900' : 'bg-white shadow-sm'}`}>
                                    <div>
                                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-widest">Target Hari Ini</h3>
                                        <span className={`text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r ${THEMES[user.theme]}`}>{Math.round(dailyProgress)}%</span>
                                    </div>
                                    <GrowthTree percentage={dailyProgress} darkMode={user.darkMode} />
                                </div>

                                <div className="p-4 rounded-2xl border flex gap-2 bg-white dark:bg-slate-900">
                                    <input value={newHabitName} onChange={e => setNewHabitName(e.target.value)} placeholder="Habit baru..." className="flex-1 bg-transparent outline-none text-sm px-2" />
                                    <button onClick={() => { 
                                        if(newHabitName) { 
                                            setHabits([...habits, { id: Date.now(), name: newHabitName, streak: 0, completed: false, note: '' }]); 
                                            setNewHabitName(''); 
                                            notify("Berhasil!");
                                        } 
                                    }} className={`px-4 py-2 rounded-xl text-white font-bold bg-gradient-to-r ${THEMES[user.theme]}`}><Icon name="Plus" className="w-4 h-4" /></button>
                                </div>

                                {habits.map(h => (
                                    <div key={h.id} className={`p-5 rounded-[1.8rem] border flex items-center justify-between bg-white dark:bg-slate-900 ${h.completed ? 'opacity-60' : ''}`}>
                                        <div className="flex items-center gap-4">
                                            <button onClick={() => toggleHabit(h.id)} className={h.completed ? 'text-emerald-500' : 'text-slate-300'}>
                                                <Icon name={h.completed ? "CheckCircle2" : "Circle"} className="w-8 h-8" />
                                            </button>
                                            <div><p className="font-bold text-sm">{h.name}</p><p className="text-[10px] text-orange-500 flex items-center gap-1"><Icon name="Flame" className="w-3 h-3" /> {h.streak} Hari</p></div>
                                        </div>
                                        <button onClick={() => setHabits(prev => prev.filter(x => x.id !== h.id))} className="text-slate-300 hover:text-red-400"><Icon name="Trash2" className="w-4 h-4" /></button>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'profile' && (
                            <div className="space-y-6 animate-in">
                                <div className={`p-8 rounded-[2rem] border ${user.darkMode ? 'bg-slate-900' : 'bg-white'}`}>
                                    <p className="text-xs font-bold uppercase mb-2">Google Gemini API Key</p>
                                    <input type="password" value={user.apiKey} onChange={e => setUser({...user, apiKey: e.target.value})} placeholder="Masukkan API Key..." className="w-full p-3 rounded-xl bg-slate-100 dark:bg-slate-800 outline-none text-sm mb-4" />
                                    <button onClick={() => setUser({...user, darkMode: !user.darkMode})} className="w-full p-4 rounded-xl bg-slate-100 dark:bg-slate-800 flex justify-between">
                                        <span className="text-sm font-bold">Mode Gelap</span>
                                        <Icon name={user.darkMode ? "Sun" : "Moon"} className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>

                    <nav className={`fixed bottom-0 left-0 right-0 border-t p-4 flex justify-around backdrop-blur-md ${user.darkMode ? 'bg-slate-950/90 border-slate-800' : 'bg-white/90 shadow-lg'}`}>
                        <button onClick={() => setActiveTab('tracker')} className={activeTab === 'tracker' ? 'text-indigo-500' : 'text-slate-400'}><Icon name="Calendar" className="w-5 h-5" /></button>
                        <button onClick={() => setActiveTab('profile')} className={activeTab === 'profile' ? 'text-indigo-500' : 'text-slate-400'}><Icon name="User" className="w-5 h-5" /></button>
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
